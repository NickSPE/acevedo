<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}FinGest{% endblock %}</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'fingest-green': '#10b981',
                        'fingest-emerald': '#059669',
                        'fingest-teal': '#0d9488',
                        'fingest-primary': '#227c91',
                        'fingest-secondary': '#605952',
                    }
                }
            }
        }
    </script>

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" integrity="sha512-9usAa10IRO0HhonpyAIVpjrylPvoDwiPUiKdWk5t3PyolY1cOd4DSE0Ga+ri4AuTroPR5aQvXU9xC6qOPnzFeg==" crossorigin="anonymous" referrerpolicy="no-referrer">

    {% block extra_css %}{% endblock %}
</head>

<body class="min-h-screen bg-gradient-to-br from-emerald-50 via-white to-blue-50">
    <!-- Header limpio para pÃ¡ginas de autenticaciÃ³n -->
    <header class="absolute top-0 left-0 right-0 z-10 p-6 bg-white bg-opacity-10 backdrop-blur-md shadow-md">
        <div class="flex justify-between items-center">
            <div class="flex items-center gap-3">
                {% load static %}
                <img src="{% static 'images/fingest_logo_im1.png' %}" alt="FinGest Logo"
                    class="h-10 w-10 border rounded-lg" />
                <h1 class="text-2xl font-bold bg-[#1d293d] bg-clip-text text-transparent">
                    FinGest
                </h1>
            </div>

            <!-- Enlaces de navegaciÃ³n para auth -->
            <div class="flex items-center gap-4 text-sm">
                {% block nav_links %}
                <a href="{% url 'usuarios:login' %}" class="text-gray-600 hover:text-emerald-600 transition-colors">
                    Iniciar SesiÃ³n
                </a>
                <a href="{% url 'usuarios:register_simple' %}"
                    class="bg-emerald-600 text-white px-4 py-2 rounded-lg hover:bg-emerald-700 transition-colors">
                    Registrarse
                </a>
                {% endblock %}
            </div>
        </div>
    </header>

    <!-- Contenido principal -->
    <main class="min-h-screen flex items-center justify-center">
        {% block content %}{% endblock %}
    </main>

    <!-- Footer limpio -->
    <footer class="absolute bottom-0 left-0 right-0 p-6 text-center text-gray-500 text-sm">
        <p>&copy; 2025 FinGest. Gestiona tus finanzas de manera inteligente.</p>
    </footer>

    {% block extra_js %}{% endblock %}
</body>

</html>
