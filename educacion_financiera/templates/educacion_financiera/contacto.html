{% extends "core/base_template.html" %}
{% block title %}Contacto | FinGest{% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto">
  <div class="bg-white rounded-lg border border-[#E5E1DD] p-6 mb-6">
    <div class="flex items-center gap-3 mb-4">
      <svg class="w-10 h-10 text-[#227C91]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
          d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" />
      </svg>
      <div>
        <h1 class="text-3xl font-bold text-[#605952]">Contáctanos</h1>
        <p class="text-[#736B5E]">Estamos aquí para ayudarte</p>
      </div>
    </div>
  </div>

  <div class="bg-white rounded-lg border border-[#E5E1DD] p-6">
    <form class="space-y-4">
      {% csrf_token %}
      <div>
        <label for="contacto-nombre" class="block text-sm font-medium text-[#605952] mb-1">Nombre</label>
        <input type="text" id="contacto-nombre" name="nombre"
          class="w-full px-3 py-2 border-2 border-[#E5E1DD] rounded-lg focus:outline-none focus:border-[#227C91] text-[#605952]">
      </div>
      <div>
        <label for="contacto-email" class="block text-sm font-medium text-[#605952] mb-1">Email</label>
        <input type="email" id="contacto-email" name="email"
          class="w-full px-3 py-2 border-2 border-[#E5E1DD] rounded-lg focus:outline-none focus:border-[#227C91] text-[#605952]">
      </div>
      <div>
        <label for="contacto-mensaje" class="block text-sm font-medium text-[#605952] mb-1">Mensaje</label>
        <textarea id="contacto-mensaje" name="mensaje" rows="5"
          class="w-full px-3 py-2 border-2 border-[#E5E1DD] rounded-lg focus:outline-none focus:border-[#227C91] text-[#605952]"></textarea>
      </div>
      <button type="submit"
        class="w-full bg-[#227C91] hover:bg-[#1a6070] text-white px-6 py-3 rounded-lg font-medium transition-colors">
        Enviar Mensaje
      </button>
    </form>
  </div>
</div>
{% endblock %}
