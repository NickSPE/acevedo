name: CI

on:
  push:
    branches: [nueva-rama-cambios]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install "pip==26.1.2" \
            --hash=sha256:382ff9f685ee3bc25864f820aa50505825f10f5458ffff07e30a6d96e5715cab
          pip install --only-binary :all: --require-hashes -r requirements.txt
          pip install --only-binary :all: --require-hashes -r requirements-test.txt

      - name: Run tests with coverage
        run: pytest
        env:
          DJANGO_SETTINGS_MODULE: FinGest.test_settings

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@0303d6b62e310685c0e34d0b9cde218036885c4d
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}